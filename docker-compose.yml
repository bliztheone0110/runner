services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: momentum
      POSTGRES_USER: momentum
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '5432:5432'
    volumes:
      - leaderboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U momentum -d momentum']
      interval: 3s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://momentum:local-development-only@database:5432/momentum
      PORT: 3001
      CORS_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - '3001:3001'
volumes:
  leaderboard-data:
